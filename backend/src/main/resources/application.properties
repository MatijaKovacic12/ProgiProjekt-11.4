spring.application.name=backend
server.port=8080
spring.application.name=touristAgency


spring.datasource.url=jdbc:postgresql://localhost:5433/turisticka_agencija
spring.datasource.username=agencija_app
spring.datasource.password=claudeJeNajjaci


spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# OAuth 2.0 login (Google). Set GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET as env variables.
# Redirect URI to register in Google Cloud Console: http://localhost:8080/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:change-me}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:change-me}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# OAuth 2.0 login (Microsoft, work/school + personal accounts). Set MICROSOFT_CLIENT_ID and MICROSOFT_CLIENT_SECRET as env variables.
# Redirect URI to register in Azure portal (App registrations): http://localhost:8080/login/oauth2/code/microsoft
spring.security.oauth2.client.registration.microsoft.client-id=${MICROSOFT_CLIENT_ID:change-me}
spring.security.oauth2.client.registration.microsoft.client-secret=${MICROSOFT_CLIENT_SECRET:change-me}
spring.security.oauth2.client.registration.microsoft.client-name=Microsoft
spring.security.oauth2.client.registration.microsoft.scope=openid,profile,email
spring.security.oauth2.client.registration.microsoft.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.microsoft.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.microsoft.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.microsoft.authorization-uri=https://login.microsoftonline.com/common/oauth2/v2.0/authorize
spring.security.oauth2.client.provider.microsoft.token-uri=https://login.microsoftonline.com/common/oauth2/v2.0/token
spring.security.oauth2.client.provider.microsoft.jwk-set-uri=https://login.microsoftonline.com/common/discovery/v2.0/keys
spring.security.oauth2.client.provider.microsoft.user-name-attribute=sub
